<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Loan Payment Calculator</title>

    <script>
        function calculatePayment() {

            let PV = Number(document.getElementById("loanAmount").value);
            let n = Number(document.getElementById("years").value);
            let r = Number(document.getElementById("interestRate").value);

            let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**(-n*12));

            document.getElementById("result").innerHTML =
                "If you have a $" + PV +
                " loan for " + n +
                " years at " + r +
                "% interest, your monthly payment will be: $" +
                P.toFixed(2);
        }
    </script>

</head>

<body>

    <h1>Loan Payment Calculator</h1>

    <p>
        Enter the loan amount, number of years, and annual interest rate
        to calculate the monthly payment.
    </p>

    <p>
        <label for="loanAmount">Loan Amount:</label>
        <input type="number" id="loanAmount">
    </p>

    <p>
        <label for="years">Years:</label>
        <input type="number" id="years">
    </p>

    <p>
        <label for="interestRate">Annual Interest Rate (%):</label>
        <input type="number" id="interestRate">
    </p>

    <button onclick="calculatePayment()">Calculate Monthly Payment</button>

    <p id="result"></p>

</body>

</html>
